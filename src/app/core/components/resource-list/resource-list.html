<section class="resource-list" [class.shrunk]="shrunk()">
  @if (isLoading()) {
    <div class="loading-state">
      <p>Loading {{ title() }}...</p>
    </div>
  } @else if (resources().length === 0) {
    <p class="no-results">
      {{ isEmpty() ? 'No results found' : 'No ' + title() + ' available yet' }}
    </p>
  } @else {
    <div class="resource-cards">
      @for (item of resources(); track item.uid) {
        <button
          type="button"
          class="resource-card"
          (click)="itemSelect.emit(item)"
          appSwipe
          (swipeLeft)="itemSelect.emit(item)"
          (swipeRight)="itemSelect.emit(item)"
        >
          <h3>{{ item.name }}</h3>
        </button>
      }
    </div>
  }
</section>
