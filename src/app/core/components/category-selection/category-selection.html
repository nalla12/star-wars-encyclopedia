<nav class="category-tabs" aria-label="Categories">
  @for (cat of categories; track cat) {
    <a
      class="cat-tab"
      [routerLink]="['/', cat]"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      ariaCurrentWhenActive="page"
    >
      <app-category-icon [category]="cat" [size]="20" />
      {{ CATEGORY_LABELS[cat] }}
    </a>
  }
</nav>
