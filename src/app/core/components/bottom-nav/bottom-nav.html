<nav class="bottom-nav" aria-label="Categories">
  @for (cat of categories; track cat) {
    <a
      class="nav-btn"
      [routerLink]="['/', cat]"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      ariaCurrentWhenActive="page"
    >
      <app-category-icon [category]="cat" [size]="24" />
      <span class="nav-label">{{ CATEGORY_LABELS[cat] }}</span>
    </a>
  }
</nav>
